<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register | GrowthZone Summer Bootcamps 2026</title>
    <meta name="description" content="Secure your spot at GrowthZone summer bootcamps – Robotics, Content Creator, or NextGen Coding. Limited seats!">

    <!-- Preload & Tailwind + Fonts -->
    <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        growzone: { orange: '#f97316', purple: '#8b5cf6', teal: '#14b8a6' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], heading: ['"Space Grotesk"', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.6s ease-out' },
                    keyframes: { fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; transition: background-color 0.2s; }
        @media (prefers-color-scheme: dark) { body { background-color: #0f172a; color: #f1f5f9; } }
        .gradient-text { background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .card-glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(226, 232, 240, 0.7); transition: all 0.25s ease; }
        @media (prefers-color-scheme: dark) { .card-glass { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(51, 65, 85, 0.6); } }
        @media (max-width: 640px) {
            .card-glass { padding: 1.25rem !important; }
            header > div { flex-wrap: wrap; }
            header .flex.gap-2 { width: 100%; justify-content: center; }
        }
        .btn-primary { background: linear-gradient(105deg, #0ea5e9, #3b82f6); transition: all 0.2s; }
        .btn-primary:hover:not(:disabled) { transform: scale(0.98); box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        input, select, textarea { transition: all 0.2s; background: var(--bg2); border: 1px solid var(--border); }
        input:focus, select:focus, textarea:focus { border-color: #0ea5e9; outline: none; ring: 2px solid #0ea5e9; }
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 2px solid white; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Track card styles */
        .track-card {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .track-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .track-card.selected {
            border-color: #0ea5e9;
            background: rgba(14, 165, 233, 0.08);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
        }
        @media (prefers-color-scheme: dark) {
            .track-card.selected {
                background: rgba(14, 165, 233, 0.2);
                border-color: #38bdf8;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased font-sans">

    <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-5 sm:px-6 lg:px-8 py-4 flex justify-between items-center flex-wrap gap-3">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-purple-500 flex items-center justify-center shadow-md">
                    <i class="fas fa-rocket text-white text-lg"></i>
                </div>
                <span class="text-xl font-heading font-bold tracking-tight">Growth <span class="gradient-text">Zone</span></span>
            </div>
            <div class="flex gap-2 bg-gray-100 dark:bg-gray-800 p-1 rounded-full">
                <button data-lang="en" class="lang-btn px-4 py-1.5 rounded-full text-sm font-medium transition-all hover:bg-primary-100 dark:hover:bg-primary-900/30">🇬🇧 English</button>
                <button data-lang="fr" class="lang-btn px-4 py-1.5 rounded-full text-sm font-medium transition-all">🇫🇷 Français</button>
            </div>
        </div>
    </header>

    <main class="flex-grow">
        <section class="py-12 md:py-20">
            <div class="max-w-5xl mx-auto px-5 sm:px-6 lg:px-8">
                <div class="card-glass rounded-3xl p-6 md:p-8 shadow-xl animate-fade-in">
                    <!-- dynamic camp preview will be injected here -->
                    <div id="campPreview"></div>

                    <form id="registerForm" class="mt-8">
                        <input type="hidden" id="campField" name="camp">
                        <input type="hidden" id="trackField" name="track">
                        
                        <!-- Dynamic track options (clickable cards) -->
                        <div class="mb-8">
                            <label class="block font-semibold text-lg mb-3" data-i18n="chooseTrack">Choose your track *</label>
                            <div id="trackOptionsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="form-group">
                                <label class="block font-semibold mb-2" data-i18n="fullName">Full Name *</label>
                                <input type="text" id="fullName" required class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-primary-500">
                            </div>
                            <div class="form-group">
                                <label class="block font-semibold mb-2" data-i18n="email">Email *</label>
                                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800">
                            </div>
                            <div class="form-group">
                                <label class="block font-semibold mb-2" data-i18n="phone">Phone Number *</label>
                                <input type="tel" id="phone" required class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800">
                            </div>
                            <div class="form-group">
                                <label class="block font-semibold mb-2" data-i18n="message">Message (optional)</label>
                                <textarea id="message" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800"></textarea>
                            </div>
                        </div>
                        <button type="submit" id="submitBtn" class="btn-primary w-full mt-6 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg">
                            <i class="fas fa-upload-alt"></i> <span data-i18n="submitBtn">Register</span>
                        </button>
                        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4" data-i18n="infoNote">Your registration will be saved securely. A confirmation email will be sent to your inbox.</p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm">
        <div class="max-w-7xl mx-auto px-4">© 2026 Growth Zone — Summer bootcamps. All rights reserved.</div>
    </footer>

    <script>
        // ----------------------------- CAMPS DATA (ENGLISH + FRENCH) ---------------------------------
        const camps = {
            robot: {
                nameEn: "Robot Builders Camp",
                nameFr: "Camp des bâtisseurs de robots",
                icon: "fa-robot",
                defaultTrack: "full",
                tracks: {
                    full: {
                        nameEn: "Full Bundle (all 4 sessions)",
                        nameFr: "Forfait complet (4 séances)",
                        price: "150 DT",
                        originalPrice: "200 DT",
                        dates: "1 week",
                        discount: "-25%",
                        modules: ["Arduino & Electronics", "BBC Micro:bit", "MIT App Inventor", "AI & 3D Modeling", "Final robot project"]
                    },
                }
            },
            content: {
                nameEn: "Content Creator Camp",
                nameFr: "Camp de créateur de contenu",
                icon: "fa-film",
                defaultTrack: "bundle",
                tracks: {
                    bundle: {
                        nameEn: "Full Bundle (CapCut + Canva + AI)",
                        nameFr: "Forfait complet (CapCut + Canva + IA)",
                        price: "450 DT",
                        originalPrice: "600 DT",
                        discount: "-25%",
                        modules: ["CapCut Video Editing", "Canva Graphic Design", "Content with AI", "Final Portfolio"]
                    },
                    capcut: {
                        nameEn: "CapCut Pro — Video Editing",
                        nameFr: "CapCut Pro — Montage vidéo",
                        price: "200 DT",
                        dates: "1 week",
                        modules: ["CapCut interface & timeline", "Effects, transitions & subtitles", "Green screen & export", "Final video project"]
                    },
                    canva: {
                        nameEn: "Canva Design",
                        nameFr: "Canva — Design graphique",
                        price: "200 DT",
                        dates: "1 week",
                        modules: ["Design basics & branding", "Social media posts & stories", "Presentations & animations", "Canva AI tools", "Final design portfolio"]
                    },
                    ai: {
                        nameEn: "AI Content Strategy",
                        nameFr: "Stratégie de contenu IA",
                        price: "200 DT",
                        dates: "1 week",
                        modules: ["Content strategy with AI", "Audience & brand identity", "Idea generation & calendar", "Scripts & multi-platform content", "Final content project"]
                    }
                }
            },
            coding: {
                nameEn: "NextGen Coding Camp",
                nameFr: "Camp de codage NextGen",
                icon: "fa-code",
                defaultTrack: "bundle",
                tracks: {
                    bundle: {
                        nameEn: "All-in-One Package (all 4 tracks)",
                        nameFr: "Package tout-en-un (4 parcours)",
                        price: "800 DT",
                        originalPrice: "1050 DT",
                        discount: "-25%",
                        modules: ["Python Programming", "Vibe Coding", "Prompt Engineering", "Machine Learning"]
                    },
                    python: {
                        nameEn: "Python Bootcamp",
                        nameFr: "Bootcamp Python",
                        price: "250 DT",
                        date: "1 week",
                        modules: ["Variables, logic & loops", "Functions & problem solving", "Turtle graphics & games", "First Python app project"]
                    },
                    vibe: {
                        nameEn: "Vibe Coding",
                        nameFr: "Programmation créative",
                        price: "250 DT",
                        date: "1 week",
                        modules: ["Creative coding fundamentals", "AI-assisted art & sound", "Interactive projects", "Mini hackathon"]
                    },
                    prompt: {
                        nameEn: "Prompt Engineering",
                        nameFr: "Ingénierie des prompts",
                        price: "250 DT",
                        date: "1 week",
                        modules: ["AI prompt fundamentals", "Chatbot building", "LLM optimization", "Applied prompt projects"]
                    },
                    ml: {
                        nameEn: "Machine Learning",
                        nameFr: "Apprentissage automatique",
                        price: "300 DT",
                        date: "2 week",
                        modules: ["Data patterns & visualization", "Train your first model", "AI ethics & bias", "Mini ML project"]
                    }
                }
            }
        };

        // ------------------------ GOOGLE APPS SCRIPT CONFIGURATION -------------------------
        // 🔧 REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEXX59ZRc7XQFFqSV2pcrDz_e4_sqYzvd5CJCHBe2sJj9kJFgYUMD0L1msswbDVzOmHQ/exec"; 
        // ⚠️ IMPORTANT: Replace the placeholder above with your actual Apps Script URL.

        // ------------------------ I18N TRANSLATIONS (EN + FR) -----------------------------------
        const translations = {
            en: {
                fullName: "Full Name *",
                email: "Email *",
                phone: "Phone Number *",
                message: "Message (optional)",
                chooseTrack: "Choose your track *",
                submitBtn: "Register",
                infoNote: "Your registration will be saved securely. A confirmation email will be sent to your inbox.",
                backToCamps: "Back to camps",
                successMsg: "🎉 Registration successful! A confirmation email has been sent to your inbox.",
                errorMsg: "❌ Submission failed. Please check your internet or try again later. If issue persists, contact us.",
                invalidEmail: "Please enter a valid email address.",
                missingFields: "Please fill all required fields."
            },
            fr: {
                fullName: "Nom complet *",
                email: "E-mail *",
                phone: "Numéro de téléphone *",
                message: "Message (optionnel)",
                chooseTrack: "Choisissez votre parcours *",
                submitBtn: "S'inscrire",
                infoNote: "Votre inscription sera enregistrée en toute sécurité. Un e-mail de confirmation vous sera envoyé.",
                backToCamps: "Retour aux camps",
                successMsg: "🎉 Inscription réussie ! Un e-mail de confirmation a été envoyé.",
                errorMsg: "❌ Échec de l'envoi. Vérifiez votre connexion ou réessayez plus tard.",
                invalidEmail: "Veuillez entrer une adresse e-mail valide.",
                missingFields: "Veuillez remplir tous les champs obligatoires."
            }
        };

        let currentLang = 'en';
        let currentCamp = 'robot';
        let currentTrack = 'bundle';

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('camp') && camps[urlParams.get('camp')]) {
            currentCamp = urlParams.get('camp');
        }
        const campData = camps[currentCamp];
        if (urlParams.has('track') && campData.tracks[urlParams.get('track')]) {
            currentTrack = urlParams.get('track');
        } else {
            currentTrack = campData.defaultTrack;
        }

        function getTrack() {
            return camps[currentCamp].tracks[currentTrack];
        }

        // Render clickable track cards
        function renderTrackOptions() {
            const container = document.getElementById('trackOptionsContainer');
            if (!container) return;
            const tracks = camps[currentCamp].tracks;
            const trackKeys = Object.keys(tracks);
            
            if (trackKeys.length === 0) return;
            
            container.innerHTML = trackKeys.map(key => {
                const track = tracks[key];
                const trackName = currentLang === 'fr' ? track.nameFr : track.nameEn;
                const price = track.price;
                const originalPrice = track.originalPrice ? track.originalPrice : null;
                const discount = track.discount ? track.discount : null;
                const isSelected = (currentTrack === key);
                
                return `
                    <div class="track-card rounded-xl border border-gray-200 dark:border-gray-700 p-4 bg-white dark:bg-gray-800/60 transition-all ${isSelected ? 'selected ring-2 ring-primary-500' : 'hover:shadow-md'}" data-track-id="${key}">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-bold text-lg text-gray-800 dark:text-gray-100">${escapeHtml(trackName)}</h3>
                            ${discount ? `<span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300 text-xs font-bold px-2 py-0.5 rounded-full">${discount}</span>` : ''}
                        </div>
                        <div class="mt-2 flex items-baseline gap-2 flex-wrap">
                            <span class="text-2xl font-bold text-primary-600 dark:text-primary-400">${price}</span>
                            ${originalPrice ? `<span class="text-sm text-gray-400 line-through">${originalPrice}</span>` : ''}
                            ${track.dates ? `<span class="text-xs text-gray-500 dark:text-gray-400 mt-2">${track.dates}</span>` : ''}
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2 flex items-center gap-1"><i class="fas fa-check-circle text-primary-500 text-xs"></i> ${currentLang === 'fr' ? 'Cliquez pour sélectionner' : 'Click to select'}</p>
                    </div>
                `;
            }).join('');
            
            // attach click listeners
            document.querySelectorAll('.track-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const trackId = card.getAttribute('data-track-id');
                    if (trackId && camps[currentCamp].tracks[trackId]) {
                        // update current track
                        currentTrack = trackId;
                        // update hidden field
                        document.getElementById('trackField').value = currentTrack;
                        // update URL params
                        const params = new URLSearchParams(window.location.search);
                        params.set('camp', currentCamp);
                        params.set('track', currentTrack);
                        history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
                        // re-render preview and track options highlight
                        renderCampPreview();
                        renderTrackOptions(); // re-render to update selected state
                    }
                });
            });
        }
        
        // simple escape to avoid XSS
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderCampPreview() {
            const camp = camps[currentCamp];
            const track = getTrack();
            const campName = currentLang === 'fr' ? camp.nameFr : camp.nameEn;
            const trackName = currentLang === 'fr' ? track.nameFr : track.nameEn;
            const t = translations[currentLang];
            const discountBadge = track.discount
                ? `<span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 text-xs font-semibold px-2 py-0.5 rounded-full">${track.discount}</span>`
                : '';
            const originalPrice = track.originalPrice
                ? `<span class="text-sm text-gray-400 line-through">${track.originalPrice}</span>`
                : '';

            document.getElementById('campPreview').innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gray-200 dark:border-gray-700 pb-6 mb-4">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-100 to-primary-200 dark:from-primary-900/40 dark:to-primary-800/20 flex items-center justify-center">
                            <i class="fas ${camp.icon} text-3xl text-primary-600 dark:text-primary-400"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">${escapeHtml(campName)}</p>
                            <h2 class="text-2xl md:text-3xl font-heading font-bold">${escapeHtml(trackName)}</h2>
                            <div class="flex items-center gap-2 mt-1 flex-wrap">
                                <span class="text-3xl font-bold text-gray-900 dark:text-white">${track.price}</span>
                                ${originalPrice}
                                ${discountBadge}
                            </div>
                        </div>
                    </div>
                    <a href="../index.html" class="text-primary-500 hover:text-primary-600 text-sm flex items-center gap-1"><i class="fas fa-arrow-left"></i> ${t.backToCamps}</a>
                </div>
                <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">
                    ${track.modules.map(m => `<div class="flex items-center gap-2 text-gray-700 dark:text-gray-300"><i class="fas fa-check-circle text-primary-500 text-sm"></i> <span>${escapeHtml(m)}</span></div>`).join('')}
                </div>
            `;
            document.getElementById('campField').value = currentCamp;
            document.getElementById('trackField').value = currentTrack;
        }

        function updateLanguage() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });
            document.documentElement.lang = currentLang === 'fr' ? 'fr' : 'en';
            document.documentElement.dir = 'ltr';
            // re-render UI with new language
            renderCampPreview();
            renderTrackOptions();
        }

        // Language switcher events
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.getAttribute('data-lang');
                document.querySelectorAll('.lang-btn').forEach(b => {
                    b.classList.remove('active', 'bg-primary-500', 'text-white');
                    b.classList.add('bg-transparent');
                });
                btn.classList.add('active', 'bg-primary-500', 'text-white');
                updateLanguage();
            });
        });
        // set initial active language button
        document.querySelector(`.lang-btn[data-lang="${currentLang}"]`).classList.add('active', 'bg-primary-500', 'text-white');
        
        // ------------------------ FORM SUBMIT HANDLER with SweetAlert -------------------
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('registerForm');

        async function submitToGoogleSheet(payload) {
            // Use CORS mode, expecting JSON response from Apps Script with { success: true, message? }
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            if (!result.success) throw new Error(result.message || 'Submission failed');
            return result;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();
            const t = translations[currentLang];
            
            // Validation
            if (!fullName || !email || !phone) {
                Swal.fire({
                    icon: 'warning',
                    title: currentLang === 'fr' ? 'Champs manquants' : 'Missing fields',
                    text: t.missingFields,
                    confirmButtonColor: '#0ea5e9'
                });
                return;
            }
            const emailRegex = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
            if (!emailRegex.test(email)) {
                Swal.fire({
                    icon: 'error',
                    title: currentLang === 'fr' ? 'Email invalide' : 'Invalid email',
                    text: t.invalidEmail,
                    confirmButtonColor: '#0ea5e9'
                });
                return;
            }
            
            // Disable button & show loading
            const originalBtnHTML = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span> <span>${currentLang === 'fr' ? 'Inscription...' : 'Registering...'}</span>`;
            
            const camp = camps[currentCamp];
            const track = getTrack();
            const campName = currentLang === 'fr' ? camp.nameFr : camp.nameEn;
            const trackName = currentLang === 'fr' ? track.nameFr : track.nameEn;
            
            const payload = {
                fullName: fullName,
                email: email,
                phone: phone,
                message: message,
                campId: currentCamp,
                campName: campName,
                trackId: currentTrack,
                trackName: trackName,
                price: track.price,
                language: currentLang,
                registrationDate: new Date().toISOString()
            };
            
            try {
                if (GOOGLE_SCRIPT_URL === "https://script.google.com/macros/s/AKfycbwEXX59ZRc7XQFFqSV2pcrDz_e4_sqYzvd5CJCHBe2sJj9kJFgYUMD0L1msswbDVzOmHQ/exec") {
                    // Demo mode: Show success simulation if script not replaced (but it's real demo)
                    // Actually we keep real script, but if empty, simulate success for demo?
                    // For demo, we check if the URL still contains the example pattern, but we provide real working default from previous deployment? I'll keep but allow testing.
                    // throw new Error("Please configure Google Apps Script URL");
                    // Actually the placeholder is present but it's the actual deployed demo; we can allow it.
                }
                const result = await submitToGoogleSheet(payload);
                Swal.fire({
                    icon: 'success',
                    title: currentLang === 'fr' ? 'Inscription confirmée !' : 'Registration confirmed!',
                    text: t.successMsg,
                    confirmButtonColor: '#0ea5e9',
                    backdrop: true
                });
                // reset optional fields but keep camp/track
                document.getElementById('fullName').value = '';
                document.getElementById('email').value = '';
                document.getElementById('phone').value = '';
                document.getElementById('message').value = '';
                // keep hidden fields
                document.getElementById('campField').value = currentCamp;
                document.getElementById('trackField').value = currentTrack;
                // re-render preview and tracks (to reflect unchanged selection)
                renderCampPreview();
                renderTrackOptions();
            } catch (error) {
                console.error("Submission error:", error);
                Swal.fire({
                    icon: 'error',
                    title: currentLang === 'fr' ? 'Erreur' : 'Submission failed',
                    text: t.errorMsg + (error.message ? " " + error.message : ""),
                    confirmButtonColor: '#0ea5e9'
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHTML;
            }
        });

        // Initial render
        renderCampPreview();
        renderTrackOptions();
        updateLanguage();
    </script>
</body>
</html>
